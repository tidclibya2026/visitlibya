# Provider-neutral reference only. Prefer managed PostgreSQL/PostGIS when available.
services:
  database:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - visitlibya_production_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build: ./backend
    environment: &api_environment
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:?required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?required}
      CORS_ORIGINS: https://tidclibya2026.github.io
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?required}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:?required}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-require}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    restart: unless-stopped
    environment: *api_environment
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  visitlibya_production_data:
