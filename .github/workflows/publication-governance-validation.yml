name: Publication Governance Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: "0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Validate governance JSON
        run: |
          python -m json.tool backend/data/governance/publication-policy.json > /dev/null
          python -m json.tool backend/data/governance/legacy-publication-baseline.json > /dev/null
          python -m json.tool backend/data/governance/publication-generation-manifest.json > /dev/null

      - name: Validate publication governance
        run: python backend/scripts/publication_governance.py

      - name: Validate generation manifest
        run: python backend/scripts/publication_generation.py validate-manifest

      - name: Generate supported artifacts outside repository
        run: python backend/scripts/publication_generation.py generate --output-dir "$RUNNER_TEMP/publication-generation"

      - name: Detect direct edits and verify protected artifacts
        run: python backend/scripts/publication_generation.py verify

      - name: Run focused governance, generation, and backend enforcement tests
        working-directory: backend
        run: python -m pytest -q tests/unit/scripts/test_publication_governance.py tests/unit/scripts/test_publication_generation.py tests/unit/publication tests/unit/core/test_publication_config.py tests/unit/schemas/test_destination_publication_fields.py
