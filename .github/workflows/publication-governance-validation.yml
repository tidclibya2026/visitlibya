name: Publication Governance Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Validate governance JSON
        run: |
          python -m json.tool backend/data/governance/publication-policy.json > /dev/null
          python -m json.tool backend/data/governance/legacy-publication-baseline.json > /dev/null

      - name: Validate publication governance
        run: python backend/scripts/publication_governance.py

      - name: Run focused governance tests
        working-directory: backend
        run: python -m pytest -q tests/unit/scripts/test_publication_governance.py
