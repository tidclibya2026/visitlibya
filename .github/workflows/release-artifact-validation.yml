name: Release artifact validation

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/release-artifact-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate source
        run: node scripts/validate-frontend.mjs
      - name: Smoke test source
        run: node scripts/smoke-test-static-site.mjs
      - name: Build preview artifact without production origin
        run: node scripts/build-pages-artifact.mjs
      - name: Validate preview artifact
        run: node scripts/validate-pages-artifact.mjs
      - name: Smoke test preview artifact
        run: node scripts/smoke-test-static-site.mjs --root .pages-artifact
      - name: Verify preview origin state
        run: node -e "const m=require('./.pages-artifact/release-manifest.json'); if(m.releaseOriginStatus!=='not-supplied') process.exit(1)"