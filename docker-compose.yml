services:
  database:
    image: postgis/postgis:16-3.4
    container_name: visitlibya-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: visitlibya
      POSTGRES_USER: visitlibya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5433:5432"
    volumes:
      - visitlibya_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U visitlibya -d visitlibya
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: visitlibya-backend
    restart: unless-stopped
    environment:
      APP_NAME: Visit Libya API
      APP_VERSION: 1.0.0
      ENVIRONMENT: development
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
    depends_on:
      database:
        condition: service_healthy

volumes:
  visitlibya_postgres_data:
